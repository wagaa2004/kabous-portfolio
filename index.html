<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KABOUS // BINARY NAME</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&family=Cairo:wght@900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050508;color:#fff;overflow-x:hidden;font-family:'JetBrains Mono'}
#bg{position:fixed;inset:0;z-index:0;opacity:0.06}
.wrap{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px}
.binary-char{display:inline-block;min-width:0.6em;transition:all 0.3s;color:#00ff88;text-shadow:0 0 10px #00ff88,0 0 30px #00ff88}
.binary-char.binary{opacity:0.8;animation:flicker 0.1s infinite}
.binary-char.real{color:#fff;text-shadow:0 0 20px #00ff88,0 0 40px #00ff88}
.binary-char.space{width:0.4em}
.en-name{font-size:72px;letter-spacing:4px;display:flex;flex-wrap:wrap;justify-content:center;gap:2px}
.ar-name{font-family:'Cairo';font-size:68px;font-weight:900;margin-top:15px;display:flex;justify-content:center;gap:4px;flex-wrap:wrap}
.ar-name .binary-char.real{color:#00ff88}
@keyframes flicker{0%,100%{opacity:0.8}50%{opacity:0.3}}
.subtitle{margin-top:40px;font-size:13px;color:#666;letter-spacing:3px;text-align:center}
.tag{margin-top:20px;border:1px solid #00ff88;padding:8px 20px;color:#00ff88;font-size:12px;letter-spacing:2px}
.btn{display:inline-block;margin-top:30px;padding:14px 28px;background:#00ff88;color:#000;font-weight:700;text-decoration:none;border-radius:6px}
@media(max-width:600px){.en-name{font-size:36px}.ar-name{font-size:32px}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="wrap">
<div style="text-align:center">
<div class="en-name" id="enName"></div>
<div class="ar-name" id="arName"></div>
</div>
<div class="subtitle">CYBER SECURITY • PENETRATION TESTER • 01101145178</div>
<div class="tag">● SYSTEM BREACH • ROOT ACCESS GRANTED</div>
<div style="margin-top:40px"><a class="btn" href="https://wa.me/201101145178">CONTACT // WHATSAPP</a></div>
</div>
<script>
const c=document.getElementById('bg'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
let cols=Math.floor(c.width/14),drops=Array(cols).fill(0);
function drawBg(){x.fillStyle='rgba(5,5,8,0.08)';x.fillRect(0,0,c.width,c.height);x.fillStyle='#00ff88';x.font='12px monospace';drops.forEach((y,i)=>{x.fillText(Math.random()>0.5?'1':'0',i*14,y*14);if(y*14>c.height&&Math.random()>0.98)drops[i]=0;drops[i]++})}setInterval(drawBg,50);
const enText="ISLAM KABOUS";const arText="إسلام كابوس";
function createBinaryName(container,text){
 container.innerHTML='';[...text].forEach((char,idx)=>{
  const span=document.createElement('span');span.className='binary-char binary';
  if(char===' '){span.className+=' space';span.textContent=' ';container.appendChild(span);return;}
  span.textContent=Math.random()>0.5?'1':'0';container.appendChild(span);
  let count=0;const max=15+Math.random()*20;
  const interval=setInterval(()=>{if(count<max){span.textContent=Math.random()>0.5?'1':'0';count++;}else{clearInterval(interval);span.textContent=char;span.classList.remove('binary');span.classList.add('real');}},50+idx*30);
 });
}
const enEl=document.getElementById('enName');const arEl=document.getElementById('arName');
createBinaryName(enEl,enText);setTimeout(()=>createBinaryName(arEl,arText),800);
setInterval(()=>{document.querySelectorAll('.binary-char.real').forEach(s=>{if(Math.random()>0.7){const orig=s.textContent;s.textContent=Math.random()>0.5?'1':'0';s.classList.remove('real');s.classList.add('binary');setTimeout(()=>{s.textContent=orig;s.classList.remove('binary');s.classList.add('real');},200+Math.random()*400);}});},3000);
</script>
</body>
</html>
